<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buku Program Majlis Graduasi Murid Tahun 6 · 2026</title>
<meta name="description" content="Buku Program Majlis Graduasi Murid Tahun 6 Tahun 2026 – SK Ru Rendang">
<meta property="og:title" content="Buku Program Majlis Graduasi Murid Tahun 6 · 2026">
<meta property="og:image" content="pages/page1.jpg">
<link rel="icon" href="pages/page1.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#19d3c5;
    --teal-deep:#0b6f6a;
    --ink:#05100f;
    --silver:#e9f3f2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    color:var(--silver);
    background:
      radial-gradient(ellipse at 50% 40%, #0f3b39 0%, #071a19 45%, #020707 100%);
    display:flex;flex-direction:column;align-items:center;
    user-select:none;-webkit-user-select:none;
  }
  /* subtle songket-like diamond pattern */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
    background-image:
      linear-gradient(45deg, var(--teal) 1px, transparent 1px),
      linear-gradient(-45deg, var(--teal) 1px, transparent 1px);
    background-size:34px 34px;
    mask-image:radial-gradient(ellipse at center, transparent 30%, #000 85%);
    -webkit-mask-image:radial-gradient(ellipse at center, transparent 30%, #000 85%);
  }
  #sparkles{position:fixed;inset:0;pointer-events:none;z-index:0}

  /* ---------- Loader ---------- */
  #loader{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:#020707;transition:opacity .8s ease, visibility .8s;
  }
  #loader.hide{opacity:0;visibility:hidden}
  .cap{font-size:54px;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}
  .loader-title{font-family:'Cinzel',serif;letter-spacing:.25em;font-size:14px;color:var(--teal)}
  .bar{width:220px;height:3px;background:#0f2a29;border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal-deep),var(--teal),#fff);transition:width .25s}

  /* ---------- Header ---------- */
  header{
    position:relative;z-index:2;text-align:center;padding:14px 10px 4px;
    opacity:0;transform:translateY(-12px);transition:all .9s ease .2s;
  }
  body.ready header{opacity:1;transform:none}
  header h1{
    font-family:'Cinzel',serif;font-weight:700;font-size:clamp(16px,2.4vw,26px);
    letter-spacing:.12em;
    background:linear-gradient(90deg,#9ff3ec,#ffffff,#9ff3ec);
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 5s linear infinite;
  }
  @keyframes shine{to{background-position:200% center}}
  header p{font-size:clamp(10px,1.2vw,13px);letter-spacing:.3em;color:#7fbfba;margin-top:2px}

  /* ---------- Stage ---------- */
  #stage{
    position:relative;z-index:1;flex:1;width:100%;
    display:flex;align-items:center;justify-content:center;
    padding:8px 60px 30px;min-height:0;
  }
  #bookWrap{
    position:relative;
    transition:transform .6s cubic-bezier(.2,.8,.2,1);
    opacity:0;transform:scale(.85) translateY(30px);
  }
  body.ready #bookWrap{opacity:1;transform:translateX(var(--shift,0)) scale(var(--zoom,1));transition:transform .6s cubic-bezier(.2,.8,.2,1), opacity 1s ease .3s}
  /* glow under the book */
  #bookWrap::after{
    content:"";position:absolute;left:8%;right:8%;bottom:-28px;height:40px;
    background:radial-gradient(ellipse at center, rgba(25,211,197,.35), transparent 70%);
    filter:blur(8px);z-index:-1;
  }
  #book{box-shadow:0 30px 60px rgba(0,0,0,.6)}

  .page{background:#0a0f0f;overflow:hidden}
  .page img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  /* paper fold shading along the spine */
  .page::after{
    content:"";position:absolute;top:0;bottom:0;width:14%;pointer-events:none;
  }
  .page.--left::after{right:0;background:linear-gradient(to left, rgba(0,0,0,.38), rgba(0,0,0,.12) 30%, transparent)}
  .page.--right::after{left:0;background:linear-gradient(to right, rgba(0,0,0,.38), rgba(0,0,0,.12) 30%, transparent)}
  .page.--simple::after{display:none}
  /* light sheen on the page surface */
  .page::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:linear-gradient(115deg, rgba(255,255,255,.06), transparent 40%, transparent 70%, rgba(255,255,255,.04));
  }
  .page.hard{background:#000}

  /* side arrows */
  .nav-arrow{
    position:absolute;top:50%;transform:translateY(-50%);z-index:5;
    width:46px;height:46px;border-radius:50%;border:1px solid rgba(25,211,197,.45);
    background:rgba(5,20,19,.6);color:var(--teal);font-size:22px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(6px);transition:all .25s;
  }
  .nav-arrow:hover{background:var(--teal);color:#021;box-shadow:0 0 22px rgba(25,211,197,.7)}
  .nav-arrow:disabled{opacity:.2;pointer-events:none}
  #prevArrow{left:10px}#nextArrow{right:10px}

  /* hint */
  #hint{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);z-index:4;
    font-size:12px;color:#9fd8d3;background:rgba(0,0,0,.45);padding:6px 14px;border-radius:20px;
    border:1px solid rgba(25,211,197,.25);white-space:nowrap;
    animation:pulse 2s ease-in-out infinite;transition:opacity .6s;
  }
  #hint.gone{opacity:0;pointer-events:none}
  @keyframes pulse{50%{opacity:.55}}

  /* ---------- Toolbar ---------- */
  #toolbar{
    position:relative;z-index:3;margin:6px 0 12px;
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
    padding:7px 12px;border-radius:40px;
    background:rgba(4,22,21,.7);border:1px solid rgba(25,211,197,.25);
    backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.4);
    opacity:0;transform:translateY(14px);transition:all .9s ease .5s;
  }
  body.ready #toolbar{opacity:1;transform:none}
  #toolbar button{
    width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
    background:transparent;color:var(--silver);display:flex;align-items:center;justify-content:center;
    transition:background .2s,color .2s;
  }
  #toolbar button:hover{background:rgba(25,211,197,.18);color:var(--teal)}
  #toolbar button.on{color:var(--teal)}
  #toolbar svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #counter{font-size:13px;min-width:74px;text-align:center;color:#bfe9e5;letter-spacing:.05em}
  .sep{width:1px;height:22px;background:rgba(25,211,197,.25);margin:0 4px}

  /* ---------- Thumbnails ---------- */
  #thumbs{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    display:flex;gap:10px;justify-content:center;overflow-x:auto;
    padding:14px 14px 18px;background:linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,.6));
    border-top:1px solid rgba(25,211,197,.3);
    transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);
  }
  #thumbs.open{transform:none}
  #thumbs img{
    height:96px;border-radius:4px;cursor:pointer;opacity:.6;border:2px solid transparent;
    transition:all .25s;flex:none;
  }
  #thumbs img:hover{opacity:1;transform:translateY(-4px)}
  #thumbs img.active{opacity:1;border-color:var(--teal);box-shadow:0 0 14px rgba(25,211,197,.6)}

  footer{position:fixed;right:12px;bottom:8px;font-size:10px;color:#4f7d79;z-index:1;letter-spacing:.05em}

  @media (max-width:700px){
    #stage{padding:4px 6px}
    #hint{font-size:11px}
    .nav-arrow{display:none}
    header{padding-top:10px}
    #toolbar{gap:2px;padding:5px 8px}
    #toolbar button{width:34px;height:34px}
    .hide-sm{display:none}
    footer{display:none}
  }
</style>
</head>
<body>

<div id="loader">
  <div class="cap">🎓</div>
  <div class="loader-title">MAJLIS GRADUASI 2026</div>
  <div class="bar"><i id="barFill"></i></div>
</div>

<canvas id="sparkles"></canvas>

<header>
  <h1>MAJLIS GRADUASI MURID TAHUN 6</h1>
  <p>BUKU PROGRAM · 2026</p>
</header>

<main id="stage">
  <button class="nav-arrow" id="prevArrow" aria-label="Halaman sebelum">&#10094;</button>
  <div id="bookWrap"><div id="book"></div></div>
  <button class="nav-arrow" id="nextArrow" aria-label="Halaman seterusnya">&#10095;</button>
  <div id="hint">👆 Tarik bucu halaman atau klik untuk menyelak</div>
</main>

<nav id="toolbar">
  <button id="btnFirst" title="Halaman pertama"><svg viewBox="0 0 24 24"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
  <button id="btnPrev" title="Sebelum"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <span id="counter">1 / 8</span>
  <button id="btnNext" title="Seterusnya"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <button id="btnLast" title="Halaman terakhir"><svg viewBox="0 0 24 24"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg></button>
  <span class="sep"></span>
  <button id="btnZoom" title="Zum" class="hide-sm"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg></button>
  <button id="btnThumbs" title="Semua halaman"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
  <button id="btnPlay" title="Main automatik" class="hide-sm"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button>
  <button id="btnSound" title="Bunyi selak" class="on"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4zM15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg></button>
  <button id="btnFull" title="Skrin penuh"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></nav>

<div id="thumbs"></div>
<footer>SK Ru Rendang · 2026</footer>

<script src="page-flip.browser.js"></script>
<script>
(function(){
  const TOTAL = 8;
  const PAGE_W = 1241, PAGE_H = 1755;            // source image size (A4 ratio)
  const srcs = Array.from({length:TOTAL},(_,i)=>`pages/page${i+1}.jpg`);
  const $ = id => document.getElementById(id);

  /* ---------- Preload images with progress ---------- */
  let loaded = 0;
  const imgs = srcs.map(src => new Promise(res => {
    const im = new Image();
    im.onload = im.onerror = () => { loaded++; $('barFill').style.width = (loaded/TOTAL*100)+'%'; res(); };
    im.src = src;
  }));

  /* ---------- Build pages ---------- */
  const book = $('book');
  srcs.forEach((src,i)=>{
    const d = document.createElement('div');
    d.className = 'page' + (i===0 || i===TOTAL-1 ? ' hard' : '');
    if (i===0 || i===TOTAL-1) d.dataset.density = 'hard';
    d.innerHTML = `<img src="${src}" alt="Halaman ${i+1}">`;
    book.appendChild(d);
  });

  /* ---------- Size the book to the screen ---------- */
  function calcSize(){
    const mobile = innerWidth <= 700;
    const availH = innerHeight - (mobile ? 135 : 150);
    const availW = innerWidth - (mobile ? 16 : 140);
    const ratio = PAGE_W / PAGE_H;
    let h = availH;
    let w = h * ratio;
    const spreads = mobile ? 1 : 2;
    if (w * spreads > availW){ w = availW / spreads; h = w / ratio; }
    return {w:Math.floor(w), h:Math.floor(h), mobile};
  }
  const s = calcSize();

  const pageFlip = new St.PageFlip(book, {
    width: s.w, height: s.h,
    size: 'fixed',
    showCover: true,
    usePortrait: s.mobile,
    drawShadow: true,
    maxShadowOpacity: 0.75,
    flippingTime: 1000,
    mobileScrollSupport: false,
    showPageCorners: true,
    swipeDistance: 25,
    autoSize: false
  });
  pageFlip.loadFromHTML(document.querySelectorAll('#book .page'));

  /* Rebuild on large resize (e.g. rotating a phone) */
  let lastMobile = s.mobile, rT;
  addEventListener('resize', ()=>{
    clearTimeout(rT);
    rT = setTimeout(()=>{
      const n = calcSize();
      if (n.mobile !== lastMobile || Math.abs(n.w - pageFlip.getSettings().width) > 40){
        location.hash = 'p' + (pageFlip.getCurrentPageIndex()+1);
        location.reload();
      }
    }, 400);
  });

  /* Centre the closed cover / back cover (desktop spread view) */
  function centre(){
    const idx = pageFlip.getCurrentPageIndex();
    const portrait = pageFlip.getOrientation() === 'portrait';
    let shift = 0;
    if (!portrait){
      const w = pageFlip.getSettings().width;
      if (idx === 0) shift = -w/2;
      else if (idx >= TOTAL-1) shift = w/2;
    }
    document.querySelector('#bookWrap').style.setProperty('--shift', shift+'px');
  }

  /* ---------- Flip sound (generated, no file needed) ---------- */
  let soundOn = true, ctx;
  function flipSound(){
    if (!soundOn) return;
    try{
      ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
      const dur = 0.45, len = ctx.sampleRate*dur;
      const buf = ctx.createBuffer(1, len, ctx.sampleRate), data = buf.getChannelData(0);
      for (let i=0;i<len;i++){
        const t = i/len;
        const env = Math.pow(Math.sin(Math.PI*Math.min(1,t*1.4)),2) * (1-t);
        data[i] = (Math.random()*2-1) * env * 0.5;
      }
      const src = ctx.createBufferSource(); src.buffer = buf;
      const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2200; bp.Q.value=0.6;
      const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=600;
      const g = ctx.createGain(); g.gain.value = 0.55;
      src.connect(bp).connect(hp).connect(g).connect(ctx.destination);
      src.start();
    }catch(e){}
  }

  /* ---------- UI updates ---------- */
  const thumbs = $('thumbs');
  srcs.forEach((src,i)=>{
    const t = document.createElement('img');
    t.src = src; t.alt = 'Halaman '+(i+1);
    t.onclick = ()=>{ pageFlip.flip(i); thumbs.classList.remove('open'); $('btnThumbs').classList.remove('on'); };
    thumbs.appendChild(t);
  });

  function update(){
    const idx = pageFlip.getCurrentPageIndex();
    const portrait = pageFlip.getOrientation() === 'portrait';
    let label;
    if (portrait || idx===0 || idx>=TOTAL-1) label = (idx+1)+' / '+TOTAL;
    else { const a = idx % 2 ? idx : idx-1; label = (a+1)+'–'+(a+2)+' / '+TOTAL; }
    $('counter').textContent = label;
    $('prevArrow').disabled = idx===0;
    $('nextArrow').disabled = idx>=TOTAL-1;
    [...thumbs.children].forEach((t,i)=>{
      const vis = portrait ? i===idx : (idx===0 ? i===0 : (i===idx || i===(idx%2? idx+1 : idx-1)));
      t.classList.toggle('active', vis);
    });
    centre();
  }

  pageFlip.on('flip', ()=>{ update(); burst(); });
  pageFlip.on('changeState', e=>{
    if (e.data === 'flipping') flipSound();
    if (e.data === 'user_fold' || e.data === 'flipping') $('hint').classList.add('gone');
  });
  pageFlip.on('changeOrientation', update);

  /* ---------- Controls ---------- */
  const next = ()=>pageFlip.flipNext(), prev = ()=>pageFlip.flipPrev();
  $('btnNext').onclick = $('nextArrow').onclick = next;
  $('btnPrev').onclick = $('prevArrow').onclick = prev;
  $('btnFirst').onclick = ()=>pageFlip.flip(0);
  $('btnLast').onclick  = ()=>pageFlip.flip(TOTAL-1);

  addEventListener('keydown', e=>{
    if (e.key==='ArrowRight' || e.key==='PageDown' || e.key===' ') { e.preventDefault(); next(); }
    if (e.key==='ArrowLeft'  || e.key==='PageUp') { e.preventDefault(); prev(); }
    if (e.key==='Home') pageFlip.flip(0);
    if (e.key==='End')  pageFlip.flip(TOTAL-1);
    if (e.key==='Escape'){ thumbs.classList.remove('open'); setZoom(false); }
  });

  $('btnThumbs').onclick = function(){ thumbs.classList.toggle('open'); this.classList.toggle('on'); };

  let zoomed = false;
  function setZoom(z){
    zoomed = z;
    document.querySelector('#bookWrap').style.setProperty('--zoom', z ? 1.45 : 1);
    $('btnZoom').classList.toggle('on', z);
  }
  $('btnZoom').onclick = ()=>setZoom(!zoomed);

  let timer = null;
  $('btnPlay').onclick = function(){
    if (timer){ clearInterval(timer); timer=null; this.classList.remove('on');
      this.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>'; return; }
    this.classList.add('on');
    this.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>';
    timer = setInterval(()=>{
      if (pageFlip.getCurrentPageIndex() >= TOTAL-1) pageFlip.flip(0); else next();
    }, 3500);
  };

  $('btnSound').onclick = function(){
    soundOn = !soundOn; this.classList.toggle('on', soundOn);
    this.innerHTML = soundOn
      ? '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4zM15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4zM22 9l-6 6M16 9l6 6"/></svg>';
  };

  $('btnFull').onclick = ()=>{
    const d = document;
    if (!d.fullscreenElement && !d.webkitFullscreenElement){
      (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen).call(d.documentElement);
    } else {
      (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    }
  };

  /* ---------- Sparkle particles ---------- */
  const cv = $('sparkles'), c2 = cv.getContext('2d');
  let P = [];
  function resizeCv(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; c2.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  resizeCv(); addEventListener('resize', resizeCv);
  function spawn(x,y,burstMode){
    P.push({
      x: x ?? Math.random()*innerWidth,
      y: y ?? innerHeight + 10,
      vx: burstMode ? (Math.random()-.5)*4 : (Math.random()-.5)*.3,
      vy: burstMode ? (Math.random()-.8)*4 : -(Math.random()*.5+.2),
      r: Math.random()*1.8+.5,
      life: 1, decay: burstMode ? .015 : .002 + Math.random()*.002,
      hue: Math.random()<.7 ? 174 : 0, white: Math.random()<.3
    });
  }
  for (let i=0;i<45;i++){ spawn(undefined, Math.random()*innerHeight); }
  function burst(){
    const r = book.getBoundingClientRect();
    for (let i=0;i<28;i++) spawn(r.left + r.width/2 + (Math.random()-.5)*40, r.top + r.height*Math.random(), true);
  }
  (function loop(){
    c2.clearRect(0,0,innerWidth,innerHeight);
    if (P.length < 60 && Math.random()<.2) spawn();
    P = P.filter(p=>p.life>0);
    for (const p of P){
      p.x += p.vx; p.y += p.vy; p.life -= p.decay;
      const a = Math.max(0,p.life) * (0.5+0.5*Math.sin(Date.now()/300 + p.x));
      c2.beginPath();
      c2.fillStyle = p.white ? `rgba(255,255,255,${a})` : `hsla(${p.hue},80%,65%,${a})`;
      c2.shadowBlur = 8; c2.shadowColor = p.white ? '#fff' : '#19d3c5';
      c2.arc(p.x,p.y,p.r,0,Math.PI*2); c2.fill();
    }
    requestAnimationFrame(loop);
  })();

  /* ---------- Start ---------- */
  Promise.all(imgs).then(()=>{
    setTimeout(()=>{
      $('loader').classList.add('hide');
      document.body.classList.add('ready');
      const m = location.hash.match(/p(\d+)/);
      if (m){ pageFlip.turnToPage(Math.min(TOTAL, +m[1]) - 1); history.replaceState(null,'',location.pathname); }
      update();
      setTimeout(()=>$('hint').classList.add('gone'), 7000);
    }, 400);
  });
})();
</script>
</body>
</html>
